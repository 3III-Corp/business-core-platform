name = "business-core-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[vars]
# Non-secret configuration. Set the actual URL and anon key per environment.
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "SET_WITH_WRANGLER_VAR_OR_DASHBOARD"
# Backend origin to which authenticated /api/* requests are forwarded.
BACKEND_API_URL = "https://YOUR_BACKEND_ORIGIN"

[[kv_namespaces]]
binding = "RBAC_PERMISSIONS_KV"
id = "REPLACE_WITH_PRODUCTION_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

# Set secrets separately; never commit secret values:
# npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# npx wrangler secret put EDGE_INTERNAL_SECRET
