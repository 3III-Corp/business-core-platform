name = "business-core-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

# Configure these non-secret values separately for each environment in
# the Cloudflare dashboard or with Wrangler's --var option:
# SUPABASE_URL, BACKEND_API_URL
# Configure SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY and EDGE_INTERNAL_SECRET
# as Worker secrets. Never commit credential values.

[[kv_namespaces]]
binding = "RBAC_PERMISSIONS_KV"
id = "2cc0acca1b9848978f59ac16e6c27f52"

[observability]
enabled = true

[observability.traces]
enabled = true

# Preview environments must use a separately provisioned KV namespace.
# Do not reuse the production namespace for preview deployments.
